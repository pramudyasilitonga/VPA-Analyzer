---
apiVersion: v1
kind: Namespace
metadata:
  name: vpa-analyzer
  labels:
    app.kubernetes.io/name: vpa-analyzer
    app.kubernetes.io/component: automation
    app.kubernetes.io/managed-by: devops

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpa-analyzer
  namespace: vpa-analyzer
  labels:
    app.kubernetes.io/name: vpa-analyzer

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vpa-analyzer-reader
  labels:
    app.kubernetes.io/name: vpa-analyzer
rules:
  - apiGroups: ["autoscaling.k8s.io"]
    resources: ["verticalpodautoscalers"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vpa-analyzer-reader
  labels:
    app.kubernetes.io/name: vpa-analyzer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vpa-analyzer-reader
subjects:
  - kind: ServiceAccount
    name: vpa-analyzer
    namespace: vpa-analyzer

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vpa-analyzer-output
  namespace: vpa-analyzer
  labels:
    app.kubernetes.io/name: vpa-analyzer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # storageClassName: <ganti-dengan-storage-class-perusahaan>

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vpa-analyzer
  namespace: vpa-analyzer
  labels:
    app.kubernetes.io/name: vpa-analyzer
    app.kubernetes.io/component: cronjob
spec:
  # Setiap tanggal 1, pukul 00:00 (WIB)
  schedule: "0 0 1 * *"
  timeZone: "Asia/Jakarta"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vpa-analyzer
            app.kubernetes.io/component: cronjob
        spec:
          serviceAccountName: vpa-analyzer
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: vpa-analyzer
              image: your-registry.example.com/devops/vpa-analyzer:latest
              imagePullPolicy: IfNotPresent
              command: ["python", "vpa_analyzer.py"]
              env:
                - name: VPA_OUTPUT_FILE
                  value: /output/vpa_recommendations.xlsx
                - name: VPA_KUBECTL_CMD
                  value: kubectl get vpa -A -o json
                - name: VPA_LIMIT_MULTIPLIER
                  value: "1.2"
                - name: VPA_LOG_LEVEL
                  value: INFO
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: output
                  mountPath: /output
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: output
              persistentVolumeClaim:
                claimName: vpa-analyzer-output
            - name: tmp
              emptyDir: {}
